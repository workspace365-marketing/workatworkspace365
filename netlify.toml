[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Het Netlify-adres is een kopie van de site. Stuur het door naar het echte domein, zodat Google maar één versie ziet.
# Deploy previews (deploy-preview-..--workatworkspace365.netlify.app) blijven gewoon werken.
[[redirects]]
  from = "https://workatworkspace365.netlify.app/*"
  to = "https://jobs.workspace365.net/:splat"
  status = 301
  force = true

# Taalkeuze op de hoofdingang: Engelstalige bezoekers naar /en/, de rest naar /nl/.
[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  conditions = { Language = ["en"] }

[[redirects]]
  from = "/"
  to = "/nl/"
  status = 302

# De marketingvacature heeft in Recruitee een nieuw adres gekregen.
[[redirects]]
  from = "/nl/vacatures/marketing-manager-overheid/"
  to = "/nl/vacatures/marketing-manager-overheid-senior/"
  status = 301

[[redirects]]
  from = "/en/open-roles/marketing-manager-overheid/"
  to = "/en/open-roles/marketing-manager-overheid-senior/"
  status = 301

# Senior Customer Success Manager: spelfout in het adres verbeterd.
[[redirects]]
  from = "/nl/vacatures/senior-customer-succes-manager/"
  to = "/nl/vacatures/senior-customer-success-manager/"
  status = 301

[[redirects]]
  from = "/en/open-roles/senior-customer-succes-manager/"
  to = "/en/open-roles/senior-customer-success-manager/"
  status = 301

# Gesloten vacatures: terug naar het overzicht.
[[redirects]]
  from = "/nl/vacatures/finance-operations-specialist/"
  to = "/nl/vacatures/"
  status = 301

[[redirects]]
  from = "/en/open-roles/finance-operations-specialist/"
  to = "/en/open-roles/"
  status = 301

# Oude Recruitee-links op jobs.workspace365.net naar de pagina op deze site.
[[redirects]]
  from = "/o/open-sollicitatie-nijkerk/*"
  to = "/nl/open-sollicitatie/"
  status = 301

[[redirects]]
  from = "/o/maak-kennis-met-workspace-365/*"
  to = "/nl/contact/"
  status = 301

[[redirects]]
  from = "/o/marketing-manager-overheid/*"
  to = "/nl/vacatures/marketing-manager-overheid-senior/"
  status = 301

[[redirects]]
  from = "/o/:slug/*"
  to = "/nl/vacatures/:slug/"
  status = 301

[[redirects]]
  from = "/o/:slug"
  to = "/nl/vacatures/:slug/"
  status = 301

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
