<a href="{{ r.url }}" data-kind="{{ r.kind }}" class="zw-card" style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 28px;align-items:center;background:linear-gradient(160deg,#FCE7EE 0%,#EEE6ED 100%);border:1px solid #EEE6ED;border-radius:22px;padding:26px 28px;color:#000000;">
          <span style="display:flex;flex-direction:column;gap:10px;min-width:0;">
            <span style="font-size:20px;font-weight:800;color:#000000;">{{ r.title }}</span>
            <span style="font-size:15.5px;line-height:1.55;color:#000000;">{{ r.pitch }}</span>
            <span style="display:flex;flex-wrap:wrap;gap:8px;padding-top:2px;">
              <span style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid {{ r.badgeBorder }};background:{{ r.badgeBg }};color:{{ r.badgeColor }};font-size:13.5px;font-weight:600;">{{ r.badge }}</span>
              <span style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#ffffff;border:1px solid #EEE6ED;font-size:13.5px;font-weight:600;color:#540047;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>Nijkerk</span>
              <span style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#ffffff;border:1px solid #EEE6ED;font-size:13.5px;font-weight:600;color:#540047;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>{{ r.work }}</span>
              <span style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#ffffff;border:1px solid #EEE6ED;font-size:13.5px;font-weight:600;color:#540047;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>{{ r.hours }}</span>
              <sc-if value="{{ r.hasContract }}" hint-placeholder-val="{{ true }}">
              <span style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#ffffff;border:1px solid #EEE6ED;font-size:13.5px;font-weight:600;color:#540047;">{{ r.contract }}</span>
              </sc-if>
              <sc-if value="{{ r.hasSalary }}" hint-placeholder-val="{{ true }}">
              <span style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#ffffff;border:1.5px solid #540047;font-size:13.5px;font-weight:800;color:#540047;">{{ r.salary }}</span>
              </sc-if>
            </span>
          </span>
          <span style="display:inline-block;padding:11px 22px;border-radius:999px;background:#540047;color:#ffffff;font-weight:700;font-size:14.5px;white-space:nowrap;">Bekijk vacature</span>
        </a>
