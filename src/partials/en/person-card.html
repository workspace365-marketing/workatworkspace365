<button type="button" class="zw-person" data-person="{{ p.i }}" aria-label="Read more about {{ p.name }}" style="position:relative;display:block;width:100%;padding:0;border:0;background:transparent;border-radius:20px;overflow:hidden;cursor:pointer;text-align:left;font-family:'Mulish',Arial,sans-serif;"><img src="{{ p.img }}" alt="" style="width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center 15%;display:block;"><span class="zw-person-tip" style="position:absolute;left:0;right:0;bottom:0;padding:40px 14px 14px;background:linear-gradient(180deg,rgba(84,0,71,0) 0%,rgba(84,0,71,0.92) 55%);display:flex;flex-direction:column;gap:3px;"><span style="font-size:15px;font-weight:900;color:#ffffff;">{{ p.name }}</span><span style="font-size:12.5px;font-weight:700;color:#FCE7EE;">{{ p.role }}</span></span></button>
